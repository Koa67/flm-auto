<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne | FLM Auto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background: #fafafa;
      color: #18181b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #fafafa; }
      .card { background: #18181b; border-color: #27272a; }
    }
    .card {
      text-align: center;
      max-width: 400px;
      padding: 3rem 2rem;
      border-radius: 1rem;
      border: 1px solid #e4e4e7;
      background: #fff;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #71717a; margin-bottom: 1.5rem; line-height: 1.6; }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      background: #18181b;
      color: #fafafa;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      button { background: #fafafa; color: #18181b; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion internet et réessayez. Les pages déjà visitées restent disponibles.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
